<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Peasy - My English Classroom</title>
<style>
  :root {
    --orange: #FF8C42;
    --yellow: #FFD166;
    --green: #4A9B4E;
    --dark: #2F2F2F;
    --bg: #FFF8F0;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif; background: var(--bg); color: var(--dark); }
  header { background: var(--orange); padding: 20px; text-align:center; color:white; }
  header .logo { width: 70px; height: 70px; margin-bottom: 8px; border-radius: 50%; background: white; padding: 4px; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
  header h1 { font-size: 1.8em; }
  header p { opacity: 0.9; }
  nav { display:flex; justify-content:center; flex-wrap:wrap; background:white; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
  nav button {
    background:none; border:none; padding:15px 20px; font-size:1em; cursor:pointer;
    font-weight:bold; color: var(--dark); border-bottom:3px solid transparent;
  }
  nav button.active { color: var(--orange); border-bottom:3px solid var(--orange); }
  section { display:none; padding: 30px 20px; max-width: 900px; margin:auto; }
  section.active { display:block; }
  section h2 { color: var(--green); margin-bottom: 10px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:20px; margin-top:20px; }
  .card {
    background:white; border-radius:16px; padding:20px; text-decoration:none; color:var(--dark);
    box-shadow:0 3px 8px rgba(0,0,0,0.08); transition:0.2s;
  }
  .card:hover { transform: translateY(-4px); box-shadow:0 6px 14px rgba(0,0,0,0.15); }
  .card h3 { color: var(--green); margin-bottom:8px; }
  .emoji { font-size:2em; margin-bottom:10px; }
</style>
</head>
<body>

<header>
  <img src="assets/logo.png" alt="Easy Peasy logo" class="logo">
  <h1>EASY PEASY</h1>
  <p>My English Classroom</p>
</header>

<nav id="nav"></nav>

<section id="home" class="active">
  <h2>👋 Welcome!</h2>
  <p>Choose a category above to start learning English.</p>
</section>

<section id="lessons">
  <h2>📚 My Lessons</h2>
  <div class="grid" id="lessons-grid"></div>
</section>

<section id="games">
  <h2>🎮 Games</h2>
  <div class="grid" id="games-grid"></div>
</section>

<section id="exercises">
  <h2>📝 Exercises</h2>
  <div class="grid" id="exercises-grid"></div>
</section>

<section id="progress">
  <h2>⭐ My Progress</h2>
  <p>Coming soon!</p>
</section>

<script>
  // 👉 C'EST ICI QUE TU AJOUTERAS TES COURS PLUS TARD
 const lessons = [
    { title: "Daily Routine", file: "lessons/daily-routine.html" },
    { title: "Family", file: "lessons/family.html" },
    { title: "Free Time Activities", file: "lessons/free-time-activities.html" },
    { title: "Present Simple", file: "lessons/present-simple.html" },
];
  const games = [
    // { title: "Game 01", file: "games/game01.html" },
  ];
  const exercises = [
    // { title: "Exercise 01", file: "exercises/exercise01.html" },
  ];

  function renderGrid(list, containerId) {
    const container = document.getElementById(containerId);
    if (list.length === 0) {
      container.innerHTML = "<p>Coming soon! 🚀</p>";
      return;
    }
    container.innerHTML = list.map(item => `
      <a class="card" href="${item.file}">
        <div class="emoji">📄</div>
        <h3>${item.title}</h3>
      </a>
    `).join("");
  }
  renderGrid(lessons, "lessons-grid");
  renderGrid(games, "games-grid");
  renderGrid(exercises, "exercises-grid");

  const tabs = [
    { id: "home", label: "🏠 Home" },
    { id: "lessons", label: "📚 Lessons" },
    { id: "games", label: "🎮 Games" },
    { id: "exercises", label: "📝 Exercises" },
    { id: "progress", label: "⭐ Progress" }
  ];
  const nav = document.getElementById("nav");
  nav.innerHTML = tabs.map(t => `<button data-tab="${t.id}">${t.label}</button>`).join("");
  nav.querySelectorAll("button").forEach((btn, i) => {
    if (i === 0) btn.classList.add("active");
    btn.addEventListener("click", () => {
      nav.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });
</script>

</body>
</html>
